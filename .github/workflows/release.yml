name: Release Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'bossier-calculator-builder/**'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP "Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+" bossier-calculator-builder/bossier-calculator-builder.php)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Determine version bump type
        id: bump_type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            # Check commit messages for version indicators
            COMMITS=$(git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD -- bossier-calculator-builder/ 2>/dev/null || git log --oneline -10 -- bossier-calculator-builder/)

            if echo "$COMMITS" | grep -qiE "(BREAKING|major:)"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$COMMITS" | grep -qiE "(feat|feature|minor:)"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          TYPE="${{ steps.bump_type.outputs.type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case $TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate changelog entry
        id: changelog
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Get commits since last tag or all commits
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD -- bossier-calculator-builder/)
          else
            COMMITS=$(git log --pretty=format:"- %s" -20 -- bossier-calculator-builder/)
          fi

          # Filter out merge commits and version bumps
          COMMITS=$(echo "$COMMITS" | grep -v "^- Merge" | grep -v "^- Bump version" | grep -v "^- Release" | head -20)

          # Create changelog entry
          ENTRY="= ${NEW_VERSION} =
          ${COMMITS}
          "

          echo "entry<<EOF" >> $GITHUB_OUTPUT
          echo "$ENTRY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Create HTML changelog for JSON
          HTML_CHANGELOG="<h4>${NEW_VERSION}</h4><ul>"
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              # Remove leading "- " and wrap in <li>
              ITEM=$(echo "$line" | sed 's/^- //')
              HTML_CHANGELOG="${HTML_CHANGELOG}<li>${ITEM}</li>"
            fi
          done <<< "$COMMITS"
          HTML_CHANGELOG="${HTML_CHANGELOG}</ul>"

          echo "html_changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$HTML_CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update version in plugin files
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Update main plugin file header
          sed -i "s/Version: .*/Version: ${NEW_VERSION}/" bossier-calculator-builder/bossier-calculator-builder.php

          # Update version constant
          sed -i "s/define( 'BOSSIER_CALC_VERSION', '.*' );/define( 'BOSSIER_CALC_VERSION', '${NEW_VERSION}' );/" bossier-calculator-builder/bossier-calculator-builder.php

      - name: Update changelog
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          CHANGELOG_FILE="bossier-calculator-builder/changelog.txt"

          # Get commits for changelog
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD -- bossier-calculator-builder/)
          else
            COMMITS=$(git log --pretty=format:"- %s" -10 -- bossier-calculator-builder/)
          fi

          # Filter commits
          COMMITS=$(echo "$COMMITS" | grep -v "^- Merge" | grep -v "^- Bump version" | grep -v "^- Release" | head -15)

          # Create new changelog entry
          NEW_ENTRY="= ${NEW_VERSION} =
          ${COMMITS}

          "

          # Prepend to changelog
          echo -e "${NEW_ENTRY}$(cat ${CHANGELOG_FILE})" > ${CHANGELOG_FILE}

      - name: Create plugin ZIP
        run: |
          cd bossier-calculator-builder
          # Remove updates folder from ZIP (not needed in plugin)
          rm -rf updates
          zip -r ../bossier-calculator-builder.zip . -x "*.git*" -x "updates/*"
          cd ..

      - name: Generate update JSON
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Read changelog and convert to HTML
          CHANGELOG_HTML=$(cat << 'HEREDOC'
          ${{ steps.changelog.outputs.html_changelog }}
          HEREDOC
          )

          # Create JSON file
          cat > update-info.json << EOF
          {
              "name": "Bossier Calculator Builder",
              "version": "${NEW_VERSION}",
              "download_url": "https://bossierbeton.nl/updates/bossier-calculator-builder.zip",
              "requires": "5.8",
              "tested": "6.4",
              "requires_php": "7.4",
              "last_updated": "${CURRENT_DATE}",
              "sections": {
                  "description": "Dynamic product calculator system for WooCommerce with admin builder and full cart/order integration.",
                  "changelog": "${CHANGELOG_HTML}"
              }
          }
          EOF

          echo "Generated update-info.json:"
          cat update-info.json

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git add -A
          git commit -m "Bump version to ${NEW_VERSION}" || echo "No changes to commit"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: Release ${{ steps.new_version.outputs.version }}
          body: |
            ## Bossier Calculator Builder v${{ steps.new_version.outputs.version }}

            ${{ steps.changelog.outputs.entry }}

            ### Installation
            Download the plugin ZIP file and install via WordPress admin.

            ### Auto-update
            Upload `bossier-calculator-builder.zip` and `update-info.json` to your server at:
            - `https://bossierbeton.nl/updates/bossier-calculator-builder.zip`
            - `https://bossierbeton.nl/updates/bossier-calculator.json`
          draft: false
          prerelease: false
          files: |
            bossier-calculator-builder.zip
            update-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Upload to server via FTP
      # Uncomment and configure FTP_SERVER, FTP_USERNAME, FTP_PASSWORD secrets
      # - name: Upload to FTP server
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: ./
      #     server-dir: /public_html/updates/
      #     include: |
      #       bossier-calculator-builder.zip
      #       update-info.json
